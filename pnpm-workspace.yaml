packages:
  - "apps/*"
  - "packages/*"

# core-js (dep de jspdf) trae un build innecesario; evitamos que rompa los comandos.
strictDepBuilds: false
verifyDepsBeforeRun: false
allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  electron: set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
  core-js: set this to true or false
  '@serialport/bindings-cpp': set this to true or false

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - electron
  - electron-builder
