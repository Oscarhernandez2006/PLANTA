packages:
  - "apps/*"
  - "packages/*"

# core-js (dep de jspdf) trae un build innecesario; evitamos que rompa los comandos.
strictDepBuilds: false
verifyDepsBeforeRun: false

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@serialport/bindings-cpp': true
  core-js: true
  electron: true
  esbuild: true
  prisma: true
