packages:
  - "apps/*"
  - "packages/*"

# core-js (dep de jspdf) trae un build innecesario; evitamos que rompa los comandos.
strictDepBuilds: false
verifyDepsBeforeRun: false

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - electron
  - electron-builder

allowBuilds:
  core-js: set this to true or false
