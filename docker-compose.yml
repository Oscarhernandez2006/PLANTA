services:
  postgres:
    image: postgres:16-alpine
    container_name: frigorifico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frigorifico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
      POSTGRES_DB: ${POSTGRES_DB:-frigorifico}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frigorifico} -d ${POSTGRES_DB:-frigorifico}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: frigorifico_postgres_data
